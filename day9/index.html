<!DOCTYPE html>
<html lang="en">
<head>
    <title>Carolina Game Day Checklist</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Carolina Game Day Checklist</h1>
    </header>

    <main>
        <h2>Game Day Bag</h2>

        <p>Add an item to your bag:</p>

         <input type="text" id="bagItem">
        <button id="addButton">Add to List</button>

        <ul id="gameDayList">
            <li>
                <input type="checkbox"> Red Polo Shirt
            </li>

            <li>
                <input type="checkbox"> Rally Towel
            </li>

            <li>
                <input type="checkbox"> Game Tickets
            </li>

            <li>
                <input type="checkbox"> Sunglasses
            </li>

            <li>
                <input type="checkbox"> Water Bottle
            </li>
    </main>

    <script src="script.js"></script>

</body>

</html>
