<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carolina Game Day Checklist</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-icon">🐓</div>
        <h1>Carolina Game Day Checklist</h1>
    </header>

    <main>

        <h2>🎒 Game Day Bag</h2>

        <div class="add-section">
            <input
                type="text"
                id="bagItem"
                placeholder="Add an item to your bag"
            >
            <button id="addButton">Add to List</button>
        </div>

        <ul id="gameDayList">

            <li>
                <input type="checkbox">
                <span class="item-icon">👕</span>
                <span class="item-name">Red Polo Shirt</span>
                <span class="chicken">🐓</span>
            </li>

            <li>
                <input type="checkbox">
                <span class="item-icon">🚩</span>
                <span class="item-name">Rally Towel</span>
                <span class="chicken">🐓</span>
            </li>

            <li>
                <input type="checkbox">
                <span class="item-icon">🎟️</span>
                <span class="item-name">Game Tickets</span>
                <span class="chicken">🐓</span>
            </li>

            <li>
                <input type="checkbox">
                <span class="item-icon">🕶️</span>
                <span class="item-name">Sunglasses</span>
                <span class="chicken">🐓</span>
            </li>

            <li>
                <input type="checkbox">
                <span class="item-icon">💧</span>
                <span class="item-name">Water Bottle</span>
                <span class="chicken">🐓</span>
            </li>

            <li>
                <input type="checkbox">
                <span class="item-icon">🧢</span>
                <span class="item-name">Carolina Hat</span>
                <span class="chicken">🐓</span>
            </li>

        </ul>

    </main>

    <script src="script.js"></script>

</body>

</html>
